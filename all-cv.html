function esc(s){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]));}
function courseGroupsFor(v){const keys=ROLE_COURSE_MAP[v.id]||Object.keys(BASELINE.courses);const seen=new Set();const groups=[];keys.forEach(k=>{if(BASELINE.courses[k]){const items=BASELINE.courses[k].filter(x=>{if(seen.has(x))return false;seen.add(x);return true});groups.push([k,items]);}});return groups;}
function allCourseCount(){return Object.values(BASELINE.courses).flat().length;}
function courseHTML(v){const groups=courseGroupsFor(v);return groups.map(([name,items])=>`<div class="course-group"><h3>${esc(name)}</h3><ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('');}
function buildCV(v){
 const jobs=BASELINE.jobs.map((j,i)=>{const bullets=i===0?v.focus.slice():j.bullets.slice();return `<div class="cv-job"><div class="cv-job-header"><div><span class="cv-job-title">${esc(j.title)}</span><span class="cv-job-company"> — ${esc(j.company)}</span></div><span class="cv-job-meta">${esc(j.period)} | ${esc(j.location)}</span></div><div class="cv-role-focus"><strong>Role alignment:</strong> ${esc(i===0?'Primary target role achievements and the strongest keyword match for this variant.':'Experience retained from the verified baseline and positioned for this target role.')}</div><ul class="cv-bullets">${bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div>`}).join('');
 const projects=BASELINE.projects.map((p,i)=>`<li><strong>${esc(p.split(':')[0])}:</strong> ${esc(p.split(':').slice(1).join(':').trim())}</li>`).join('');
 const skills=v.skills.map(s=>`<li><span class="cat">${esc(s.split(':')[0])}:</span> ${esc(s.split(':').slice(1).join(':').trim())}</li>`).join('');
 const edu=BASELINE.education.map(e=>`<div class="cv-edu-item"><div class="cv-job-header"><span class="cv-edu-degree">${esc(e.degree)}</span><span class="cv-job-meta">${esc(e.year)}</span></div><div class="cv-edu-inst">${esc(e.inst)}</div></div>`).join('');
 return `<header class="cv-header"><div class="cv-name">${esc(BASELINE.name)}</div><div class="cv-target-title">${esc(v.title)}</div><div class="cv-contact">${BASELINE.contact.map(c=>`<span>${esc(c)}</span>`).join('')}</div></header>
<section class="cv-section"><h2 class="cv-section-title">Professional Summary</h2><p class="cv-summary">${esc(v.summary)}</p><div class="badge-row"><span class="badge">ATS-optimized keyword structure</span><span class="badge">Role-targeted achievements</span><span class="badge">No unverified vendor exam status claimed</span></div></section>
<section class="cv-section"><h2 class="cv-section-title">Core ATS Keywords</h2><p class="cv-keywords"><strong>Target:</strong> ${esc(v.title)} · <strong>Keywords:</strong> ${esc(v.skills.join(' | '))}</p></section>
<section class="cv-section"><h2 class="cv-section-title">Technical Skills</h2><ul class="cv-skills">${skills}</ul></section>
<section class="cv-section"><h2 class="cv-section-title">Professional Experience</h2>${jobs}</section>
<section class="cv-section"><h2 class="cv-section-title">Key Projects</h2><ul class="cv-projects">${projects}</ul></section>
<section class="cv-section"><h2 class="cv-section-title">Education</h2>${edu}</section>
<section class="cv-section"><h2 class="cv-section-title">Professional Courses & Learning — Role-Relevant Selection</h2><div class="cv-course-groups">${courseHTML(v)}</div><div class="cv-note">Full learning catalog contains ${allCourseCount()} supplied course completions / learning credentials across AI & Data Science, Software Engineering, Cybersecurity & Systems, Project Management & Business, Design & UX, E-commerce & Digital Marketing, Salesforce & Customer Success, and additional specializations. Course completion is presented as supplied; vendor examination/certification status is not independently verified.</div></section>`;
}
const tabStrip=document.getElementById('tabStrip'),container=document.getElementById('cvContainer'),counter=document.getElementById('variantCounter');let current=0;
VARIANTS.forEach((v,i)=>{const b=document.createElement('button');b.className='tab-btn'+(i===0?' active':'');b.textContent=v.label;b.onclick=()=>{current=i;render(i)};tabStrip.appendChild(b)});
function render(i){container.innerHTML=buildCV(VARIANTS[i]);counter.textContent=`${i+1} / ${VARIANTS.length}`;document.querySelectorAll('.tab-btn').forEach((b,j)=>b.classList.toggle('active',j===i));document.title=`Usama Khan | ${VARIANTS[i].title} | ATS CV 2026`}
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){current=Math.min(current+1,VARIANTS.length-1);render(current)}if(e.key==='ArrowLeft'){current=Math.max(current-1,0);render(current)}});render(0);
const allContainer=document.getElementById('allContainer');
function exportAll(){
 allContainer.innerHTML=VARIANTS.map(v=>`<div class="cv-container print-page">${buildCV(v)}</div>`).join('');
 document.body.classList.add('printing-all');
 window.print();
}
function restoreAfterPrint(){document.body.classList.remove('printing-all');allContainer.innerHTML='';}
window.addEventListener('afterprint',restoreAfterPrint);
if(window.matchMedia){const mq=window.matchMedia('print');mq.addListener&&mq.addListener(m=>{if(!m.matches)restoreAfterPrint()});}
</script>
</body>
</html>
